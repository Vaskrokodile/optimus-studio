<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sky New York City</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d18; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(circle at 50% 25%, transparent 0 35%, rgba(3, 6, 15, .42) 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; padding: clamp(22px, 4vw, 58px); }
    .eyebrow { color: #ffbfd7; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; font-weight: 750; }
    h1 { color: #fff7fb; margin: 9px 0 7px; font-size: clamp(31px, 5vw, 64px); line-height: .96; letter-spacing: -.045em; }
    .subtitle { max-width: 440px; color: rgba(240, 241, 255, .72); line-height: 1.6; font-size: 13px; }
    .legend {
      position: absolute; left: clamp(22px, 4vw, 58px); bottom: clamp(20px, 3vw, 42px);
      display: flex; gap: 18px; color: rgba(255, 255, 255, .62); font-size: 11px;
    }
    .legend span { display: inline-flex; gap: 7px; align-items: center; }
    .legend i { width: 5px; height: 5px; background: #ff9fc5; border-radius: 50%; box-shadow: 0 0 12px #ff9fc5; }
    .status {
      position: absolute; right: clamp(22px, 4vw, 58px); top: clamp(22px, 4vw, 58px);
      color: rgba(255,255,255,.7); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 9px 13px;
      background: rgba(5, 9, 18, .45); backdrop-filter: blur(12px);
    }
    .status::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: #75f1c4; box-shadow: 0 0 10px #75f1c4; }
    @media (max-width: 620px) { .subtitle { max-width: 270px; } .legend { gap: 10px; flex-wrap: wrap; max-width: 260px; } }
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main class="hud" aria-label="Interactive Three.js scene">
    <div class="eyebrow">Interactive voxel study</div>
    <h1>Sky New York City</h1>
    <div class="subtitle">A living low-poly landscape shaped from instanced voxels, custom shaders, and wind-driven particles.</div>
    <div class="status">Realtime</div>
    <div class="legend"><span><i></i>Drag to orbit</span><span><i></i>Scroll to zoom</span><span><i></i>Particles follow the wind</span></div>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const sceneSpec = {"title":"Sky New York City","sceneType":"city","sky":"#0000ff","fog":"#f5f5f5","waterDeep":"#00008b","waterShallow":"#d3d3d3","blossom":"#ff80ab","terrainRadius":12.0,"terrainHeight":10.0,"waterSize":200.0,"petalCount":120,"camera":[10.0,5.0,10.0],"trees":[{"x":-5.5,"z":0.0,"scale":0.5},{"x":0.0,"z":0.0,"scale":0.5},{"x":5.5,"z":0.0,"scale":0.5}],"details":["new york city","Sky theme","Atmospheric depth"],"motion":{"waterSpeed":1.0,"petalFallSpeed":1.0,"cameraOrbitSpeed":0.1},"buildings":[{"x":50.0,"z":0.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.5,"saturation":0.5,"lightness":0.5},{"x":100.0,"z":0.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.7,"saturation":0.3,"lightness":0.8},{"x":150.0,"z":0.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.3,"saturation":0.7,"lightness":0.6},{"x":200.0,"z":0.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.9,"saturation":0.1,"lightness":0.4},{"x":50.0,"z":10.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.2,"saturation":0.6,"lightness":0.9},{"x":100.0,"z":10.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.4,"saturation":0.2,"lightness":0.3},{"x":150.0,"z":10.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.6,"saturation":0.5,"lightness":0.7},{"x":200.0,"z":10.0,"width":2.0,"depth":4.0,"height":30.0,"hue":0.1,"saturation":0.8,"lightness":0.4}]};

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(sceneSpec.sky);
    scene.fog = new THREE.FogExp2(sceneSpec.fog, 0.018);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 240);
    camera.position.set(...sceneSpec.camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 15;
    controls.maxDistance = 80;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 2.8, 0);

    scene.add(new THREE.HemisphereLight(0xbcd8ff, 0x372734, 1.7));
    const sun = new THREE.DirectionalLight(0xffe1d1, 3.3);
    sun.position.set(-18, 30, 16);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -28;
    sun.shadow.camera.right = sun.shadow.camera.top = 28;
    scene.add(sun);
    const rim = new THREE.PointLight(0xff70aa, 28, 55, 2);
    rim.position.set(12, 9, -14);
    scene.add(rim);

    const world = new THREE.Group();
    world.rotation.y = -0.18;
    scene.add(world);
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    // === ISLAND TERRAIN ===
    function terrainHeight(x, z) {
      const radius = Math.sqrt(x * x + z * z);
      const island = Math.max(0, 1 - radius / 13.8);
      const terraces = Math.floor((island * 7.2 + Math.sin(x * .62) * .38 + Math.cos(z * .55) * .31) * 1.25) / 1.25;
      return Math.max(0, terraces);
    }

    function createVoxelIsland() {
      const placements = [];
      for (let x = -14; x <= 14; x += 1) {
        for (let z = -14; z <= 14; z += 1) {
          const height = terrainHeight(x, z);
          if (height <= 0 || Math.sqrt(x * x + z * z) > 14.2) continue;
          for (let y = -1.4; y <= height; y += 1) placements.push({ x, y, z, top: y + 1 > height });
        }
      }
      const geometry = new THREE.BoxGeometry(.96, .96, .96);
      geometry.translate(0, .48, 0);
      const material = new THREE.MeshStandardMaterial({ roughness: .88, metalness: .03, vertexColors: true });
      const terrain = new THREE.InstancedMesh(geometry, material, placements.length);
      terrain.castShadow = terrain.receiveShadow = true;
      placements.forEach((block, index) => {
        dummy.position.set(block.x, block.y, block.z);
        const edge = Math.sqrt(block.x * block.x + block.z * block.z) / 14;
        dummy.scale.setScalar(.98 - Math.max(0, edge - .8) * .2);
        dummy.updateMatrix();
        terrain.setMatrixAt(index, dummy.matrix);
        if (block.top) color.setHSL(.30 + Math.sin(block.x) * .012, .42, .28 + block.y * .018);
        else color.setHSL(.075, .26, .19 + Math.max(0, block.y) * .008);
        terrain.setColorAt(index, color);
      });
      terrain.instanceMatrix.needsUpdate = true;
      if (terrain.instanceColor) terrain.instanceColor.needsUpdate = true;
      world.add(terrain);
    }

    // === DESERT ISLAND WITH MOUNTAIN ===
    function desertTerrainHeight(x, z) {
      const radius = Math.sqrt(x * x + z * z);
      const island = Math.max(0, 1 - radius / 16.0);
      const mountain = Math.max(0, 1 - radius / 6.0);
      const base = island * 3.0;
      const peak = Math.pow(mountain, 2.5) * 14.0;
      const noise = Math.sin(x * .4) * .3 + Math.cos(z * .35) * .25;
      return Math.max(0, base + peak + noise);
    }

    function createDesertIsland() {
      const placements = [];
      for (let x = -16; x <= 16; x += 1) {
        for (let z = -16; z <= 16; z += 1) {
          const height = desertTerrainHeight(x, z);
          if (height <= 0) continue;
          const radius = Math.sqrt(x * x + z * z);
          if (radius > 16.2) continue;
          for (let y = -1.0; y <= height; y += 1) {
            placements.push({ x, y, z, top: y + 1 > height, height, radius });
          }
        }
      }
      const geometry = new THREE.BoxGeometry(.96, .96, .96);
      geometry.translate(0, .48, 0);
      const material = new THREE.MeshStandardMaterial({ roughness: .95, metalness: .02, vertexColors: true });
      const terrain = new THREE.InstancedMesh(geometry, material, placements.length);
      terrain.castShadow = terrain.receiveShadow = true;
      placements.forEach((block, index) => {
        dummy.position.set(block.x, block.y, block.z);
        dummy.scale.setScalar(.98);
        dummy.updateMatrix();
        terrain.setMatrixAt(index, dummy.matrix);
        const heightFrac = block.height > 0 ? Math.min(1, block.y / block.height) : 0;
        if (block.top && heightFrac > 0.7) {
          color.setHSL(.08, .15, .55 + heightFrac * .15);
        } else if (block.top) {
          color.setHSL(.10, .35, .45 + heightFrac * .1);
        } else {
          color.setHSL(.09, .30, .30 + heightFrac * .15);
        }
        terrain.setColorAt(index, color);
      });
      terrain.instanceMatrix.needsUpdate = true;
      if (terrain.instanceColor) terrain.instanceColor.needsUpdate = true;
      world.add(terrain);
    }

    // === CITY GRID (NYC) ===
    function createCityGrid() {
      const groundGeometry = new THREE.PlaneGeometry(80, 80);
      const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: .92 });
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      world.add(ground);

      // Street grid lines
      const streetMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: .88 });
      for (let i = -30; i <= 30; i += 8) {
        const hStreet = new THREE.Mesh(new THREE.PlaneGeometry(80, 1.2), streetMaterial);
        hStreet.rotation.x = -Math.PI / 2;
        hStreet.position.set(0, 0.02, i);
        world.add(hStreet);
        const vStreet = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 80), streetMaterial);
        vStreet.rotation.x = -Math.PI / 2;
        vStreet.position.set(i, 0.02, 0);
        world.add(vStreet);
      }

      // Buildings from sceneSpec.buildings
      const buildings = sceneSpec.buildings || [];
      const buildingMaterial = new THREE.MeshStandardMaterial({ roughness: .42, metalness: .28, vertexColors: false });
      buildings.forEach((b) => {
        const w = Math.max(1, b.width || 3);
        const d = Math.max(1, b.depth || 3);
        const h = Math.max(2, b.height || 10);
        const bx = b.x || 0;
        const bz = b.z || 0;
        const hue = b.hue !== undefined ? b.hue : 0.55;
        const sat = b.saturation !== undefined ? b.saturation : 0.08;
        const light = b.lightness !== undefined ? b.lightness : 0.18;
        const mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(hue, sat, light),
          roughness: .42, metalness: .28
        });
        const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        building.position.set(bx, h / 2, bz);
        building.castShadow = true;
        building.receiveShadow = true;
        world.add(building);

        // Window lights (emissive dots on the front face)
        if (h > 6) {
          const winMat = new THREE.MeshStandardMaterial({
            color: 0xffe08a, emissive: 0xffd060, emissiveIntensity: 1.2
          });
          const winGeo = new THREE.BoxGeometry(w * 0.7, 0.3, 0.05);
          for (let wy = 2; wy < h - 1; wy += 2.5) {
            const winRow = new THREE.Mesh(winGeo, winMat);
            winRow.position.set(bx, wy, bz + d / 2 + 0.03);
            world.add(winRow);
          }
        }
      });
    }

    // === EIFFEL TOWER (Paris) ===
    function createEiffelTower(x, z, scale) {
      const tower = new THREE.Group();
      const ironMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: .72, metalness: .45 });

      // Four legs
      const legGeo = new THREE.BoxGeometry(.5 * scale, 5 * scale, .5 * scale);
      for (const [lx, lz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const leg = new THREE.Mesh(legGeo, ironMat);
        leg.position.set(lx * 1.5 * scale, 2.5 * scale, lz * 1.5 * scale);
        leg.castShadow = true;
        tower.add(leg);
      }

      // First platform
      const plat1 = new THREE.Mesh(new THREE.BoxGeometry(4 * scale, .4 * scale, 4 * scale), ironMat);
      plat1.position.y = 5 * scale;
      plat1.castShadow = true;
      tower.add(plat1);

      // Tapered mid-section
      const midGeo = new THREE.BoxGeometry(.35 * scale, 6 * scale, .35 * scale);
      for (const [lx, lz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const mid = new THREE.Mesh(midGeo, ironMat);
        mid.position.set(lx * .8 * scale, 8 * scale, lz * .8 * scale);
        mid.castShadow = true;
        tower.add(mid);
      }

      // Second platform
      const plat2 = new THREE.Mesh(new THREE.BoxGeometry(2.2 * scale, .35 * scale, 2.2 * scale), ironMat);
      plat2.position.y = 11 * scale;
      plat2.castShadow = true;
      tower.add(plat2);

      // Upper section
      const upperGeo = new THREE.BoxGeometry(.25 * scale, 5 * scale, .25 * scale);
      for (const [lx, lz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const upper = new THREE.Mesh(upperGeo, ironMat);
        upper.position.set(lx * .4 * scale, 14 * scale, lz * .4 * scale);
        upper.castShadow = true;
        tower.add(upper);
      }

      // Top spire
      const spire = new THREE.Mesh(new THREE.ConeGeometry(.3 * scale, 4 * scale, 8), ironMat);
      spire.position.y = 19 * scale;
      spire.castShadow = true;
      tower.add(spire);

      // Antenna tip
      const antenna = new THREE.Mesh(new THREE.CylinderGeometry(.05 * scale, .12 * scale, 2 * scale, 6), ironMat);
      antenna.position.y = 22 * scale;
      tower.add(antenna);

      tower.position.set(x, 0, z);
      tower.scale.setScalar(scale);
      world.add(tower);
      return tower;
    }

    function createParisScene() {
      // Ground plane (city floor)
      const groundGeometry = new THREE.PlaneGeometry(100, 100);
      const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3328, roughness: .9 });
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      world.add(ground);

      // Seine river
      const riverMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(sceneSpec.waterDeep || 0x1a3a5c),
        roughness: .15, metalness: .3, transparent: true, opacity: .8
      });
      const river = new THREE.Mesh(new THREE.PlaneGeometry(100, 8), riverMat);
      river.rotation.x = -Math.PI / 2;
      river.position.set(0, 0.05, 12);
      world.add(river);

      // Eiffel Tower at center
      createEiffelTower(0, 0, 1.2);

      // Surrounding Parisian buildings (haussmann-style)
      const buildings = sceneSpec.buildings || [];
      const defaultBuildings = [
        { x: -12, z: -8, w: 5, h: 7, d: 5, hue: 0.08, sat: 0.05, light: 0.55 },
        { x: 12, z: -8, w: 5, h: 6, d: 5, hue: 0.08, sat: 0.05, light: 0.50 },
        { x: -14, z: 4, w: 6, h: 8, d: 5, hue: 0.08, sat: 0.06, light: 0.52 },
        { x: 14, z: 4, w: 6, h: 7, d: 5, hue: 0.08, sat: 0.04, light: 0.48 },
        { x: -10, z: -16, w: 5, h: 6, d: 5, hue: 0.08, sat: 0.05, light: 0.55 },
        { x: 10, z: -16, w: 5, h: 7, d: 5, hue: 0.08, sat: 0.05, light: 0.50 },
        { x: -18, z: -12, w: 4, h: 5, d: 4, hue: 0.08, sat: 0.04, light: 0.45 },
        { x: 18, z: -12, w: 4, h: 5, d: 4, hue: 0.08, sat: 0.04, light: 0.48 },
      ];
      const allBuildings = buildings.length > 0 ? buildings : defaultBuildings;
      allBuildings.forEach((b) => {
        const w = b.w || b.width || 4;
        const d = b.d || b.depth || 4;
        const h = b.h || b.height || 6;
        const mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(b.hue || 0.08, b.sat || 0.05, b.light || 0.5),
          roughness: .65, metalness: .08
        });
        const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        building.position.set(b.x, h / 2, b.z);
        building.castShadow = true;
        building.receiveShadow = true;
        world.add(building);
        // Roof
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: .8 });
        const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.4, d + 0.3), roofMat);
        roof.position.set(b.x, h + 0.2, b.z);
        world.add(roof);
      });
    }

    // === SKY ISLAND WITH CHINESE BUILDING ===
    function skyIslandTerrainHeight(x, z) {
      const radius = Math.sqrt(x * x + z * z);
      const island = Math.max(0, 1 - radius / 12.0);
      const noise = Math.sin(x * .5) * .25 + Math.cos(z * .45) * .2;
      return Math.max(0, island * 4.0 + noise);
    }

    function createSkyIsland() {
      const floatHeight = sceneSpec.floatHeight || 18;
      const islandGroup = new THREE.Group();
      islandGroup.position.y = floatHeight;

      // Island base (voxel)
      const placements = [];
      for (let x = -12; x <= 12; x += 1) {
        for (let z = -12; z <= 12; z += 1) {
          const height = skyIslandTerrainHeight(x, z);
          if (height <= 0 || Math.sqrt(x * x + z * z) > 12.2) continue;
          for (let y = -2.0; y <= height; y += 1) {
            placements.push({ x, y, z, top: y + 1 > height, isBottom: y < -1 });
          }
        }
      }
      const geometry = new THREE.BoxGeometry(.96, .96, .96);
      geometry.translate(0, .48, 0);
      const material = new THREE.MeshStandardMaterial({ roughness: .85, metalness: .04, vertexColors: true });
      const terrain = new THREE.InstancedMesh(geometry, material, placements.length);
      terrain.castShadow = terrain.receiveShadow = true;
      placements.forEach((block, index) => {
        dummy.position.set(block.x, block.y, block.z);
        dummy.scale.setScalar(.98);
        dummy.updateMatrix();
        terrain.setMatrixAt(index, dummy.matrix);
        if (block.isBottom) {
          color.setHSL(.05, .2, .15);
        } else if (block.top) {
          color.setHSL(.30, .35, .32 + block.y * .015);
        } else {
          color.setHSL(.08, .25, .22 + block.y * .01);
        }
        terrain.setColorAt(index, color);
      });
      terrain.instanceMatrix.needsUpdate = true;
      if (terrain.instanceColor) terrain.instanceColor.needsUpdate = true;
      islandGroup.add(terrain);

      // Chinese pagoda building
      createPagoda(0, 0, 1.0, islandGroup);

      // Floating rocks below island
      for (let i = 0; i < 6; i++) {
        const rockGeo = new THREE.DodecahedronGeometry(.5 + Math.random() * .8, 0);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: .9 });
        const rock = new THREE.Mesh(rockGeo, rockMat);
        const angle = (i / 6) * Math.PI * 2;
        rock.position.set(
          Math.cos(angle) * 8,
          -3 - Math.random() * 4,
          Math.sin(angle) * 8
        );
        rock.castShadow = true;
        islandGroup.add(rock);
      }

      world.add(islandGroup);
    }

    function createPagoda(x, z, scale, parent) {
      const pagoda = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b4c2a, roughness: .78 });
      const roofMat = new THREE.MeshStandardMaterial({ color: 0xa02020, roughness: .65, metalness: .1 });
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4a020, roughness: .4, metalness: .5, emissive: 0x4a3010, emissiveIntensity: .3 });

      const levels = 4;
      const baseWidth = 5 * scale;
      for (let level = 0; level < levels; level++) {
        const w = baseWidth * (1 - level * 0.15);
        const levelY = level * 3.5 * scale;

        // Pillars / walls
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xc4a070, roughness: .7 });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 2.5 * scale, w), wallMat);
        wall.position.y = levelY + 1.25 * scale;
        wall.castShadow = true;
        pagoda.add(wall);

        // Roof (curved upturned eaves)
        const roofSize = w + 1.5 * scale;
        const roof = new THREE.Mesh(new THREE.ConeGeometry(roofSize * 0.75, 1.2 * scale, 4), roofMat);
        roof.position.y = levelY + 3.1 * scale;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        pagoda.add(roof);

        // Upturned eave corners
        for (let corner = 0; corner < 4; corner++) {
          const angle = corner * Math.PI / 2 + Math.PI / 4;
          const eave = new THREE.Mesh(new THREE.BoxGeometry(.3 * scale, .3 * scale, 1.5 * scale), roofMat);
          eave.position.set(
            Math.cos(angle) * roofSize * 0.5,
            levelY + 3.0 * scale,
            Math.sin(angle) * roofSize * 0.5
          );
          eave.rotation.y = angle;
          eave.rotation.z = -0.3;
          pagoda.add(eave);
        }
      }

      // Finial spire on top
      const finial = new THREE.Mesh(new THREE.ConeGeometry(.2 * scale, 2 * scale, 8), goldMat);
      finial.position.y = levels * 3.5 * scale + 1.5 * scale;
      pagoda.add(finial);

      pagoda.position.set(x, skyIslandTerrainHeight(x, z), z);
      parent.add(pagoda);
    }

    // === WATER ===
    const waterUniforms = {
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(0x071b35) },
      uShallow: { value: new THREE.Color(0x1d7690) },
      uSun: { value: new THREE.Color(0xffb7d2) }
    };
    function createShaderWater() {
      const geometry = new THREE.PlaneGeometry(130, 130, 48, 48);
      const material = new THREE.ShaderMaterial({
        uniforms: waterUniforms,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexShader: `
          uniform float uTime;
          varying float vWave;
          varying vec3 vWorld;
          void main() {
            vec3 p = position;
            float a = sin(p.x * .32 + uTime * 1.25) * .18;
            float b = cos(p.y * .27 - uTime * .92) * .14;
            float c = sin((p.x + p.y) * .12 + uTime * .6) * .12;
            p.z += a + b + c;
            vWave = a + b + c;
            vec4 world = modelMatrix * vec4(p, 1.0);
            vWorld = world.xyz;
            gl_Position = projectionMatrix * viewMatrix * world;
          }
        `,
        fragmentShader: `
          uniform vec3 uDeep;
          uniform vec3 uShallow;
          uniform vec3 uSun;
          varying float vWave;
          varying vec3 vWorld;
          void main() {
            float rings = .5 + .5 * sin(vWorld.x * .34 + vWorld.z * .28 + vWave * 9.0);
            vec3 water = mix(uDeep, uShallow, clamp(rings * .32 + vWave + .42, 0.0, 1.0));
            float glint = pow(max(0.0, vWave + .24), 4.0) * 3.0;
            gl_FragColor = vec4(water + uSun * glint, .79);
          }
        `
      });
      const water = new THREE.Mesh(geometry, material);
      water.rotation.x = -Math.PI / 2;
      water.position.y = -.78;
      scene.add(water);
    }

    // === SAKURA TREES ===
    function createSakuraTree(x, z, scale = 1) {
      const tree = new THREE.Group();
      const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x4d2831, roughness: .92 });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.34 * scale, .56 * scale, 5.7 * scale, 7), trunkMaterial);
      trunk.position.y = 2.85 * scale;
      trunk.castShadow = true;
      tree.add(trunk);
      const branchGeometry = new THREE.CylinderGeometry(.12 * scale, .24 * scale, 3.2 * scale, 6);
      for (let i = 0; i < 5; i += 1) {
        const branch = new THREE.Mesh(branchGeometry, trunkMaterial);
        branch.position.set(Math.cos(i * 1.27) * .65 * scale, (4.3 + (i % 2) * .45) * scale, Math.sin(i * 1.27) * .65 * scale);
        branch.rotation.z = Math.PI * (.24 + (i % 3) * .04);
        branch.rotation.y = i * 1.27;
        branch.castShadow = true;
        tree.add(branch);
      }
      const bloomGeometry = new THREE.IcosahedronGeometry(.82 * scale, 1);
      const bloomMaterial = new THREE.MeshStandardMaterial({ color: 0xff9fc3, roughness: .76, emissive: 0x2c0718, emissiveIntensity: .35 });
      for (let i = 0; i < 13; i += 1) {
        const bloom = new THREE.Mesh(bloomGeometry, bloomMaterial);
        const angle = i * 2.399;
        const radius = (1.05 + (i % 4) * .28) * scale;
        bloom.position.set(Math.cos(angle) * radius, (5.7 + Math.sin(i * 1.8) * .7) * scale, Math.sin(angle) * radius);
        bloom.scale.set(1.15, .72 + (i % 3) * .12, 1.05);
        bloom.castShadow = true;
        tree.add(bloom);
      }
      tree.position.set(x, terrainHeight(x, z), z);
      tree.scale.setScalar(scale);
      world.add(tree);
    }

    // === DESERT CACTUS / DEAD TREE ===
    function createDesertVegetation(x, z, scale = 1) {
      const veg = new THREE.Group();
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6a5a3a, roughness: .95 });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.15 * scale, .25 * scale, 3 * scale, 6), trunkMat);
      trunk.position.y = 1.5 * scale;
      trunk.castShadow = true;
      veg.add(trunk);
      // Sparse branches
      for (let i = 0; i < 3; i++) {
        const branch = new THREE.Mesh(new THREE.CylinderGeometry(.08 * scale, .12 * scale, 1.5 * scale, 5), trunkMat);
        branch.position.set(Math.cos(i * 2.1) * .3 * scale, (2 + i * .4) * scale, Math.sin(i * 2.1) * .3 * scale);
        branch.rotation.z = Math.PI * (.15 + i * .05);
        branch.castShadow = true;
        veg.add(branch);
      }
      veg.position.set(x, desertTerrainHeight(x, z), z);
      veg.scale.setScalar(scale);
      world.add(veg);
    }

    // === CLOUDS (for sky island) ===
    function createClouds() {
      const cloudGroup = new THREE.Group();
      const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .55, roughness: 1.0 });
      for (let i = 0; i < 12; i++) {
        const cloud = new THREE.Group();
        const puffs = 3 + Math.floor(Math.random() * 3);
        for (let p = 0; p < puffs; p++) {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(1 + Math.random() * 1.5, 8, 6), cloudMat);
          puff.position.set(p * 1.2 - puffs * .6, Math.random() * .5, Math.random() * .5);
          cloud.add(puff);
        }
        const angle = (i / 12) * Math.PI * 2;
        const dist = 25 + Math.random() * 15;
        cloud.position.set(Math.cos(angle) * dist, 5 + Math.random() * 10, Math.sin(angle) * dist);
        cloudGroup.add(cloud);
      }
      scene.add(cloudGroup);
      return cloudGroup;
    }

    // === FALLING PARTICLES ===
    function createFallingPetals() {
      const count = 360;
      const positions = new Float32Array(count * 3);
      const drift = new Float32Array(count);
      for (let i = 0; i < count; i += 1) {
        positions[i * 3] = (Math.random() - .5) * 38;
        positions[i * 3 + 1] = Math.random() * 22;
        positions[i * 3 + 2] = (Math.random() - .5) * 38;
        drift[i] = .35 + Math.random() * .8;
      }
      const petalGeometry = new THREE.BufferGeometry();
      petalGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      petalGeometry.setAttribute('aDrift', new THREE.BufferAttribute(drift, 1));
      const petalMaterial = new THREE.PointsMaterial({ color: 0xffb0cb, size: .16, transparent: true, opacity: .88, sizeAttenuation: true, depthWrite: false });
      const petals = new THREE.Points(petalGeometry, petalMaterial);
      scene.add(petals);
      return petals;
    }

    // === SCENE TYPE DISPATCHER ===
    // The sceneType is read from sceneSpec and the appropriate scene is built.
    let petals = null;
    let cloudGroup = null;
    const sceneType = (typeof sceneSpec !== 'undefined' && sceneSpec.sceneType) || 'island';

    if (sceneType === 'island' || sceneType === 'sakura') {
      createVoxelIsland();
      createShaderWater();
      if (typeof sceneSpec !== 'undefined' && sceneSpec.trees) {
        sceneSpec.trees.forEach(tree => createSakuraTree(tree.x, tree.z, tree.scale));
      } else {
        createSakuraTree(-4, -1, 1.08);
        createSakuraTree(3, -3, .78);
        createSakuraTree(2, 5, .64);
      }
      petals = createFallingPetals();
    } else if (sceneType === 'desert') {
      createDesertIsland();
      createShaderWater();
      if (typeof sceneSpec !== 'undefined' && sceneSpec.trees) {
        sceneSpec.trees.forEach(tree => createDesertVegetation(tree.x, tree.z, tree.scale));
      } else {
        createDesertVegetation(-5, 3, .8);
        createDesertVegetation(4, -2, .6);
        createDesertVegetation(2, 6, .5);
      }
    } else if (sceneType === 'city') {
      createCityGrid();
    } else if (sceneType === 'paris') {
      createParisScene();
    } else if (sceneType === 'sky_island') {
      createSkyIsland();
      cloudGroup = createClouds();
      petals = createFallingPetals();
    } else {
      // Fallback: island
      createVoxelIsland();
      createShaderWater();
      createSakuraTree(-4, -1, 1.08);
      createSakuraTree(3, -3, .78);
      createSakuraTree(2, 5, .64);
      petals = createFallingPetals();
    }

    // === DESIGNED DETAILS ===
    if (typeof sceneSpec !== 'undefined' && sceneSpec.details) {
      function detailMesh(geometry, material, x, y, z) {
        const mesh = new THREE.Mesh(geometry, material); mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; return mesh;
      }
      function createDesignedDetails() {
        sceneSpec.details.forEach((label, index) => {
          const name = label.toLowerCase(); const group = new THREE.Group(); group.name = label;
          const wood = new THREE.MeshStandardMaterial({ color: 0x6f392b, roughness: .86 });
          const stone = new THREE.MeshStandardMaterial({ color: 0x727886, roughness: .94 });
          const vermilion = new THREE.MeshStandardMaterial({ color: 0xb72f35, roughness: .72 });
          if (name.includes('torii') || name.includes('gate')) {
            group.add(detailMesh(new THREE.BoxGeometry(.38, 4.4, .38), vermilion, -1.5, 2.2, 0));
            group.add(detailMesh(new THREE.BoxGeometry(.38, 4.4, .38), vermilion, 1.5, 2.2, 0));
            group.add(detailMesh(new THREE.BoxGeometry(4.2, .42, .5), vermilion, 0, 4.25, 0));
            group.add(detailMesh(new THREE.BoxGeometry(3.4, .28, .42), vermilion, 0, 3.55, 0));
          } else if (name.includes('dock') || name.includes('bridge')) {
            for (let plank = 0; plank < 8; plank += 1) group.add(detailMesh(new THREE.BoxGeometry(2.5, .18, .52), wood, 0, .35, plank * .48));
            for (const x of [-1.05, 1.05]) for (const z of [0, 3.4]) group.add(detailMesh(new THREE.CylinderGeometry(.12, .16, 1.8, 7), wood, x, -.2, z));
          } else if (name.includes('lantern')) {
            for (let lantern = 0; lantern < 4; lantern += 1) {
              const x = (lantern - 1.5) * 1.4; group.add(detailMesh(new THREE.CylinderGeometry(.1, .15, 1.5, 7), stone, x, .75, 0));
              const lamp = detailMesh(new THREE.BoxGeometry(.5, .55, .5), new THREE.MeshStandardMaterial({ color: 0xffd38b, emissive: 0xff6a2a, emissiveIntensity: 1.8 }), x, 1.55, 0); group.add(lamp);
            }
          } else if (name.includes('path') || name.includes('stone')) {
            for (let step = 0; step < 9; step += 1) group.add(detailMesh(new THREE.CylinderGeometry(.42 + step % 2 * .12, .5, .16, 7), stone, (step - 4) * .8, .14, Math.sin(step) * .5));
          } else if (name.includes('cactus') || name.includes('rock')) {
            for (let rock = 0; rock < 5; rock += 1) {
              const mesh = detailMesh(new THREE.DodecahedronGeometry(.3 + rock % 3 * .14, 0), stone, Math.cos(rock * 2.4) * (1 + rock * .1), .2, Math.sin(rock * 2.4) * (1 + rock * .1));
              mesh.scale.y = .65 + rock % 2 * .5; group.add(mesh);
            }
          } else if (name.includes('cloud') || name.includes('mist')) {
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .5 });
            for (let p = 0; p < 4; p++) {
              const puff = detailMesh(new THREE.SphereGeometry(.6 + p * .2, 8, 6), cloudMat, p * .8 - 1.2, .5, 0);
              group.add(puff);
            }
          } else if (name.includes('pagoda') || name.includes('temple') || name.includes('shrine')) {
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xa02020, roughness: .65 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xc4a070, roughness: .7 });
            for (let lvl = 0; lvl < 3; lvl++) {
              const w = 2.2 - lvl * .3;
              group.add(detailMesh(new THREE.BoxGeometry(w, 1.2, w), wallMat, 0, lvl * 1.8 + .6, 0));
              const roof = detailMesh(new THREE.ConeGeometry(w * .8, .5, 4), roofMat, 0, lvl * 1.8 + 1.45, 0);
              roof.rotation.y = Math.PI / 4; group.add(roof);
            }
          } else if (name.includes('building') || name.includes('tower') || name.includes('skyscraper')) {
            const bldgMat = new THREE.MeshStandardMaterial({ color: 0x4a4a5a, roughness: .5, metalness: .2 });
            group.add(detailMesh(new THREE.BoxGeometry(1.5, 5, 1.5), bldgMat, 0, 2.5, 0));
          } else {
            for (let rock = 0; rock < 7; rock += 1) {
              const mesh = detailMesh(new THREE.DodecahedronGeometry(.35 + rock % 3 * .16, 0), stone, Math.cos(rock * 2.4) * (1 + rock * .12), .25, Math.sin(rock * 2.4) * (1 + rock * .12));
              mesh.scale.y = .65 + rock % 2 * .5; group.add(mesh);
            }
          }
          const angle = index * 2.399 + .35; const radius = Math.min(12, 5 + index * 1.8);
          const x = Math.cos(angle) * radius; const z = Math.sin(angle) * radius;
          group.position.set(x, 0, z); group.rotation.y = -angle + Math.PI * .5; world.add(group);
        });
      }
      createDesignedDetails();
    }

    const clock = new THREE.Clock();
    let elapsed = 0;
    let lastInteraction = 0;
    controls.addEventListener('start', () => { lastInteraction = elapsed; });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), .04);
      elapsed += delta;
      waterUniforms.uTime.value = elapsed * (typeof sceneSpec !== 'undefined' && sceneSpec.motion ? sceneSpec.motion.waterSpeed : 1.0);
      if (petals) {
        const positions = petals.geometry.attributes.position;
        const drifts = petals.geometry.attributes.aDrift;
        const fallSpeed = typeof sceneSpec !== 'undefined' && sceneSpec.motion ? sceneSpec.motion.petalFallSpeed : 0.72;
        for (let i = 0; i < positions.count; i += 1) {
          let y = positions.getY(i) - delta * (fallSpeed + drifts.getX(i));
          let x = positions.getX(i) + Math.sin(elapsed * .9 + i * .17) * delta * .38;
          let z = positions.getZ(i) + Math.cos(elapsed * .64 + i * .11) * delta * .16;
          if (y < -.4) { y = 16 + Math.random() * 7; x = (Math.random() - .5) * 32; z = (Math.random() - .5) * 32; }
          positions.setXYZ(i, x, y, z);
        }
        positions.needsUpdate = true;
      }
      if (cloudGroup) {
        cloudGroup.rotation.y += delta * 0.02;
      }
      if (elapsed - lastInteraction > 4) {
        const radius = 34;
        const orbitSpeed = typeof sceneSpec !== 'undefined' && sceneSpec.motion ? sceneSpec.motion.cameraOrbitSpeed : 0.055;
        camera.position.x += (Math.cos(elapsed * orbitSpeed) * radius - camera.position.x) * .0012;
        camera.position.z += (Math.sin(elapsed * orbitSpeed) * radius - camera.position.z) * .0012;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resize, { passive: true });
    animate();
  </script>
</body>
