[project]
name = "il-tool-sql-analyst-v1"
version = "0.1.0"
description = "IL tool-calling: schema-first SQL analytics. Teaches introspection before querying, explicit projections, query-count efficiency, destructive-DDL avoidance."
tags = ["tools", "il", "sql", "single-turn", "v1"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.2.0", "il-toolcalling-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["il_tool_sql_analyst_v1"]

[tool.verifiers.eval]
num_examples = 4
rollouts_per_example = 4
