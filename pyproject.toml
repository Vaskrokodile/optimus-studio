[project]
name = "iloptimus"
version = "0.2.0"
description = "Optimus Studio — a full local harness for open-source models. Bundles IL (Intuition Learning, SFT+GRPO) and PQLoRA (parameter-targeted QLoRA for more efficient fine-tuning). Detects hardware, recommends models, runs via mlx_lm/vllm."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    # Apple Silicon path: MLX for inference + LoRA/QLoRA training.
    "mlx-lm>=0.31.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-dspark>=0.7.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # NVIDIA/CUDA path: HF Transformers + PEFT for LoRA/QLoRA training and
    # logprob computation. These have Windows CUDA wheels alongside Linux.
    # vLLM itself is an optional extra (linux only) because it does not build
    # on Windows; the vllm backend lazily imports it and falls back to HF
    # model.generate when it is absent.
    # NOTE: torch is installed from the PyTorch CUDA index (see [tool.uv] below)
    # so that CUDA wheels are used instead of the CPU-only PyPI wheels.
    "torch>=2.3.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "transformers>=4.45.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "peft>=0.11.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "accelerate>=0.34.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "safetensors>=0.4.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "huggingface-hub>=0.24.0",
    "numpy>=1.24.0",
    "mcp>=1.27,<2",
    "httpx>=0.27",
    "gymnasium>=0.29.0",
]

[project.optional-dependencies]
# vLLM gives the CUDA backend high-throughput batched inference. Install with
# `uv pip install 'iloptimus[cuda]'` on a Linux machine with NVIDIA GPUs.
# vLLM is Linux-only (no Windows builds); bitsandbytes ships Windows wheels.
cuda = [
    "vllm>=0.6.0; sys_platform == 'linux'",
    "bitsandbytes>=0.43.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
# Legacy alias kept for backward compatibility.
vllm = ["vllm>=0.6.0; sys_platform == 'linux'"]
dev = ["pytest>=8.0.0", "ruff>=0.12.0"]

[project.scripts]
iloptimus = "iloptimus.cli:main"

# PyTorch CUDA wheels are not on PyPI. uv needs the PyTorch index to resolve
# CUDA-enabled torch on Linux and Windows. On macOS (Apple Silicon), torch
# is not installed (MLX is used instead), so the index is harmless.
[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu124"]
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "iloptimus",
    "il_toolcalling_core/il_toolcalling_core",
    "il_tool_fs_navigator_v1",
    "il_tool_sql_analyst_v1",
    "il_tool_web_research_v1",
    "il_tool_booking_flow_v1",
    "il_tool_pipeline_v1",
    "il_tool_error_recovery_v1",
    "il_tool_distractor_v1",
    "il_tool_parallel_v1",
    "il_tool_interpreter_v1",
    "il_tool_devops_triage_v1",
    "il_tool_api_reliability_v1",
    "il_coding_v1/il_coding_v1",
    "il_reasoning_v1/il_reasoning_v1",
    "il_agentic_reasoning_v1/il_agentic_reasoning_v1",
    "il_agentic_coding_v1/il_agentic_coding_v1",
]
